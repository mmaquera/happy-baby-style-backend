services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: happy_baby_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DOCKER_DB_NAME:-happy_baby_style}
      POSTGRES_USER:     ${DOCKER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USER:-postgres} -d ${DOCKER_DB_NAME:-happy_baby_style}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: happy_baby_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── legacy-api ───────────────────────────────────────────────────────────────
  legacy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: happy_baby_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    # Load secrets / app config from the local .env file, then override
    # DATABASE_URL and REDIS_URL so they point to the Docker network services.
    env_file: .env
    environment:
      NODE_ENV:     development
      DATABASE_URL: postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      REDIS_URL:    redis://redis:6379
    volumes:
      # Persist uploads and logs on the host so they survive container restarts
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── category-service ────────────────────────────────────────────────────────
  category-service:
    build:
      context: .
      dockerfile: Dockerfile.category-service
    container_name: happy_baby_category_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CATEGORY_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV:                  development
      CATEGORY_SERVICE_PORT:     3002
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3001}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── product-service ──────────────────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product-service
    container_name: happy_baby_product_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PRODUCT_SERVICE_PORT:-3003}:3003"
    environment:
      NODE_ENV:                  development
      PRODUCT_SERVICE_PORT:      3003
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3001}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── order-service ────────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order-service
    container_name: happy_baby_order_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-3005}:3005"
    environment:
      NODE_ENV:                  development
      ORDER_SERVICE_PORT:        3005
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      REDIS_URL:                 redis://redis:6379
      PRODUCT_SERVICE_URL:       http://product-service:3003/graphql
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── media-service ────────────────────────────────────────────────────────────
  media-service:
    build:
      context: .
      dockerfile: Dockerfile.media-service
    container_name: happy_baby_media_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEDIA_SERVICE_PORT:-3004}:3004"
    environment:
      NODE_ENV:                  development
      MEDIA_SERVICE_PORT:        3004
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3001}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
    volumes:
      - ./uploads:/workspace/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── user-service ────────────────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: happy_baby_user_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT:-3006}:3006"
    environment:
      NODE_ENV:                  development
      USER_SERVICE_PORT:         3006
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/${DOCKER_DB_NAME:-happy_baby_style}
      JWT_SECRET:                ${JWT_SECRET}
      SMTP_HOST:                 ${SMTP_HOST:-}
      SMTP_PORT:                 ${SMTP_PORT:-587}
      SMTP_SECURE:               ${SMTP_SECURE:-false}
      SMTP_USER:                 ${SMTP_USER:-}
      SMTP_PASSWORD:             ${SMTP_PASSWORD:-}
      SMTP_FROM:                 ${SMTP_FROM_EMAIL:-noreply@happybabystyle.com}
      FRONTEND_URL:              ${FRONTEND_URL:-http://localhost:3000}
      RESET_PASSWORD_URL:        ${RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── gateway ─────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: happy_baby_gateway
    restart: unless-stopped
    depends_on:
      legacy-api:
        condition: service_healthy
      category-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      NODE_ENV:                development
      GATEWAY_PORT:            4000
      LEGACY_API_URL:          http://legacy-api:3001/graphql
      CATEGORY_SERVICE_URL:    http://category-service:3002/graphql
      PRODUCT_SERVICE_URL:     http://product-service:3003/graphql
      MEDIA_SERVICE_URL:       http://media-service:3004/graphql
      ORDER_SERVICE_URL:       http://order-service:3005/graphql
      USER_SERVICE_URL:        http://user-service:3006/graphql
      FRONTEND_URLS:           ${FRONTEND_URLS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  redis_data:
