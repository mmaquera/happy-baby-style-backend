services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: happy_baby_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DOCKER_DB_NAME:-happy_baby_style}
      POSTGRES_USER:     ${DOCKER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USER:-postgres} -d ${DOCKER_DB_NAME:-happy_baby_style}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: happy_baby_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── db-init ──────────────────────────────────────────────────────────────────
  db-init:
    image: postgres:16-alpine
    container_name: happy_baby_db_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DOCKER_DB_PASSWORD}
      PGUSER:     ${DOCKER_DB_USER:-postgres}
      PGHOST:     postgres
    volumes:
      - ./docker/init-databases.sql:/init-databases.sql
    entrypoint: ["psql", "-f", "/init-databases.sql"]
    restart: "no"

  # ── category-service ────────────────────────────────────────────────────────
  category-service:
    build:
      context: .
      dockerfile: apps/category-service/Dockerfile
    container_name: happy_baby_category_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${CATEGORY_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV:                  development
      LOG_FORMAT:                simple
      CATEGORY_SERVICE_PORT:     3002
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/happy_baby_category
      JWT_SECRET:                ${JWT_SECRET}
      REDIS_URL:                 redis://redis:6379
      RBAC_STREAM_NAME:          ${RBAC_STREAM_NAME:-stream:record-rules-updated}
      RBAC_STREAM_MAXLEN:        ${RBAC_STREAM_MAXLEN:-10000}
      RBAC_CACHE_TTL_MS:         ${RBAC_CACHE_TTL_MS:-300000}
      RBAC_CONSUMER_GROUP:       category-service-rbac-cg
      USER_SERVICE_INTERNAL_URL: http://user-service:3006
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3001}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
      TRUST_PROXY:               ${TRUST_PROXY:-loopback}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── product-service ──────────────────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: happy_baby_product_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${PRODUCT_SERVICE_PORT:-3003}:3003"
    environment:
      NODE_ENV:                  development
      LOG_FORMAT:                simple
      PRODUCT_SERVICE_PORT:      3003
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/happy_baby_product
      JWT_SECRET:                ${JWT_SECRET}
      REDIS_URL:                 redis://redis:6379
      RBAC_STREAM_NAME:          ${RBAC_STREAM_NAME:-stream:record-rules-updated}
      RBAC_STREAM_MAXLEN:        ${RBAC_STREAM_MAXLEN:-10000}
      RBAC_CACHE_TTL_MS:         ${RBAC_CACHE_TTL_MS:-300000}
      RBAC_CONSUMER_GROUP:       product-service-rbac-cg
      USER_SERVICE_INTERNAL_URL: http://user-service:3006
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3001}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
      TRUST_PROXY:               ${TRUST_PROXY:-loopback}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── order-service ────────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: happy_baby_order_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${ORDER_SERVICE_PORT:-3005}:3005"
    environment:
      NODE_ENV:                  development
      LOG_FORMAT:                simple
      ORDER_SERVICE_PORT:        3005
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/happy_baby_order
      JWT_SECRET:                ${JWT_SECRET}
      REDIS_URL:                 redis://redis:6379
      RBAC_STREAM_NAME:          ${RBAC_STREAM_NAME:-stream:record-rules-updated}
      RBAC_STREAM_MAXLEN:        ${RBAC_STREAM_MAXLEN:-10000}
      RBAC_CACHE_TTL_MS:         ${RBAC_CACHE_TTL_MS:-300000}
      RBAC_CONSUMER_GROUP:       order-service-rbac-cg
      USER_SERVICE_INTERNAL_URL: http://user-service:3006
      PRODUCT_SERVICE_URL:       http://product-service:3003/graphql
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
      TRUST_PROXY:               ${TRUST_PROXY:-loopback}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  # Opcional: sólo necesario cuando STORAGE_DRIVER=s3.
  # En modo local (STORAGE_DRIVER=local o unset), media-service NO depende de MinIO
  # y el stack arranca sin este servicio.
  # Consola web: http://localhost:9001  (usuario/contraseña: ver MINIO_ROOT_USER/PASSWORD)
  minio:
    image: minio/minio:latest
    container_name: happy_baby_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── minio-init (one-shot bucket creation) ────────────────────────────────────
  # Crea el bucket happy-baby-media al primer arranque. No falla el stack si MinIO
  # no está disponible en modo local — el perfil 'storage' lo activa cuando se
  # necesita S3. Con docker-compose base, este servicio corre y termina.
  minio-init:
    image: minio/mc:latest
    container_name: happy_baby_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME:      ${S3_BUCKET_NAME:-happy-baby-media}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$S3_BUCKET_NAME &&
        mc anonymous set download local/$$S3_BUCKET_NAME &&
        echo 'Bucket $$S3_BUCKET_NAME ready.'
      "
    restart: "no"

  # ── media-service ────────────────────────────────────────────────────────────
  media-service:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    container_name: happy_baby_media_service
    restart: unless-stopped
    # NOTA: depends_on NO incluye minio porque MinIO es opcional (STORAGE_DRIVER=local
    # es el default y funciona sin él). Si cambias a STORAGE_DRIVER=s3, asegúrate de
    # levantar MinIO primero: `docker compose up minio minio-init -d`
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_SERVICE_PORT:-3004}:3004"
    environment:
      NODE_ENV:                  development
      LOG_FORMAT:                simple
      MEDIA_SERVICE_PORT:        3004
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/happy_baby_media
      JWT_SECRET:                ${JWT_SECRET}
      REDIS_URL:                 redis://redis:6379
      RBAC_STREAM_NAME:          ${RBAC_STREAM_NAME:-stream:record-rules-updated}
      RBAC_STREAM_MAXLEN:        ${RBAC_STREAM_MAXLEN:-10000}
      RBAC_CACHE_TTL_MS:         ${RBAC_CACHE_TTL_MS:-300000}
      RBAC_CONSUMER_GROUP:       media-service-rbac-cg
      USER_SERVICE_INTERNAL_URL: http://user-service:3006
      STORAGE_BASE_URL:          ${STORAGE_BASE_URL:-http://localhost:3004}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
      TRUST_PROXY:               ${TRUST_PROXY:-loopback}
      # ── Object storage (S3-compatible via MinIO) ──────────────────────────
      # STORAGE_DRIVER=local (default) → archivos locales en /app/uploads, no necesita MinIO.
      # STORAGE_DRIVER=s3             → usa las vars S3_* de abajo; requiere MinIO corriendo.
      STORAGE_DRIVER:            ${STORAGE_DRIVER:-local}
      S3_ENDPOINT:               ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET_NAME:            ${S3_BUCKET_NAME:-happy-baby-media}
      S3_REGION:                 ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID:          ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY:      ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_URL:             ${S3_PUBLIC_URL:-http://localhost:9000/happy-baby-media}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── user-service ────────────────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: happy_baby_user_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${USER_SERVICE_PORT:-3006}:3006"
    environment:
      NODE_ENV:                  development
      LOG_FORMAT:                simple
      USER_SERVICE_PORT:         3006
      DATABASE_URL:              postgresql://${DOCKER_DB_USER:-postgres}:${DOCKER_DB_PASSWORD}@postgres:5432/happy_baby_user
      JWT_SECRET:                ${JWT_SECRET}
      REDIS_URL:                 redis://redis:6379
      RBAC_STREAM_NAME:          ${RBAC_STREAM_NAME:-stream:record-rules-updated}
      RBAC_STREAM_MAXLEN:        ${RBAC_STREAM_MAXLEN:-10000}
      RBAC_CACHE_TTL_MS:         ${RBAC_CACHE_TTL_MS:-300000}
      RBAC_CONSUMER_GROUP:       user-service-rbac-cg
      SMTP_HOST:                 ${SMTP_HOST:-}
      SMTP_PORT:                 ${SMTP_PORT:-587}
      SMTP_SECURE:               ${SMTP_SECURE:-false}
      SMTP_USER:                 ${SMTP_USER:-}
      SMTP_PASSWORD:             ${SMTP_PASSWORD:-}
      SMTP_FROM:                 ${SMTP_FROM:-noreply@happybabystyle.com}
      FRONTEND_URL:              ${FRONTEND_URL:-http://localhost:3000}
      RESET_PASSWORD_URL:        ${RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      FRONTEND_URLS:             ${FRONTEND_URLS:-http://localhost:3000}
      # Account lockout configuration (Workstream 1c)
      MAX_LOGIN_ATTEMPTS:        ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION:          ${LOCKOUT_DURATION:-900}
      # RBAC seed is a manual cut-over step (NOT run on container boot).
      # After pnpm run docker:reset, seed ONCE from the host:
      #   DATABASE_URL=postgresql://${DOCKER_DB_USER:-postgres}:<DOCKER_DB_PASSWORD>@localhost:${DOCKER_DB_PORT:-5432}/happy_baby_user \
      #     pnpm exec prisma db seed
      # MFA encryption key — SECRET, never commit a real value.
      # AES-256-GCM key (32 bytes base64-encoded). Use secret manager in production.
      # Generate: openssl rand -base64 32
      MFA_ENC_KEY:               ${MFA_ENC_KEY:-}
      # Email verification URL (front-end deep link base; token appended as ?token=...)
      VERIFY_EMAIL_URL:          ${VERIFY_EMAIL_URL:-http://localhost:3000/verify-email}
      TRUST_PROXY:               ${TRUST_PROXY:-loopback}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── gateway ─────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: happy_baby_gateway
    restart: unless-stopped
    depends_on:
      category-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      NODE_ENV:                development
      LOG_FORMAT:              simple
      GATEWAY_PORT:            4000
      CATEGORY_SERVICE_URL:    http://category-service:3002/graphql
      PRODUCT_SERVICE_URL:     http://product-service:3003/graphql
      MEDIA_SERVICE_URL:       http://media-service:3004/graphql
      ORDER_SERVICE_URL:       http://order-service:3005/graphql
      USER_SERVICE_URL:        http://user-service:3006/graphql
      FRONTEND_URLS:           ${FRONTEND_URLS:-http://localhost:3000}
      REDIS_URL:               redis://redis:6379
      RATE_LIMIT_GENERAL:      ${RATE_LIMIT_GENERAL:-300}
      RATE_LIMIT_AUTH:         ${RATE_LIMIT_AUTH:-10}
      # Controls X-Forwarded-For trust. 'loopback' = safe for docker-compose.
      # Set to '1' when behind a single nginx/ALB in production.
      # NEVER use 'true' — allows IP spoofing.
      TRUST_PROXY:             ${TRUST_PROXY:-loopback}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
